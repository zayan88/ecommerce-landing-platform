<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4f0e8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bedCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="340" rx="16" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect y="330" width="600" height="150" fill="url(#floorGrad)"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="#94a3b8" stroke-width="2"/>

  <!-- Bedroom Window with Sun Rays -->
  <g transform="translate(60, 40)" opacity="0.9">
    <rect x="0" y="0" width="130" height="190" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="5"/>
    <rect x="8" y="8" width="114" height="174" fill="#e0f2fe"/>
    <line x1="65" y1="8" x2="65" y2="182" stroke="#ffffff" stroke-width="4"/>
    <line x1="8" y1="95" x2="122" y2="95" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Sun glow outside window -->
    <circle cx="65" cy="50" r="28" fill="#fef08a" opacity="0.6"/>
  </g>

  <!-- Soft Bedside Rug -->
  <ellipse cx="360" cy="405" rx="180" ry="45" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Bedside Lamp Light Cone -->
  <polygon points="175,170 120,360 230,360" fill="url(#warmLight)"/>

  <!-- Modern Bed -->
  <g transform="translate(250, 160)" filter="url(#softShadow)">
    <!-- Wooden Headboard -->
    <rect x="0" y="0" width="310" height="170" rx="12" fill="#78350f"/>
    <rect x="8" y="8" width="294" height="154" rx="8" fill="#92400e"/>

    <!-- Mattress Base -->
    <rect x="15" y="110" width="280" height="85" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Bedspread / Blanket (Teal Blue) -->
    <path d="M 15 140 Q 155 130 295 140 L 295 195 L 15 195 Z" fill="url(#bedCover)"/>
    
    <!-- Folded Sheet Detail -->
    <path d="M 15 140 Q 155 130 295 140 L 295 152 Q 155 142 15 152 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Pillows -->
    <rect x="35" y="85" width="105" height="50" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="155" y="85" width="105" height="50" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Bed Legs -->
    <rect x="25" y="195" width="16" height="35" rx="4" fill="#78350f"/>
    <rect x="270" y="195" width="16" height="35" rx="4" fill="#78350f"/>
  </g>

  <!-- Bedside Nightstand (Close to Bed) -->
  <g transform="translate(130, 220)" filter="url(#softShadow)">
    <!-- Cabinet Body -->
    <rect x="0" y="40" width="90" height="110" rx="8" fill="#b45309"/>
    <rect x="5" y="48" width="80" height="42" rx="4" fill="#d97706"/>
    <rect x="5" y="96" width="80" height="46" rx="4" fill="#d97706"/>
    
    <!-- Drawer Handles -->
    <rect x="35" y="66" width="20" height="5" rx="2" fill="#fef08a"/>
    <rect x="35" y="116" width="20" height="5" rx="2" fill="#fef08a"/>
    
    <!-- Legs -->
    <rect x="8" y="150" width="10" height="20" rx="3" fill="#78350f"/>
    <rect x="72" y="150" width="10" height="20" rx="3" fill="#78350f"/>

    <!-- Table Lamp on Top -->
    <ellipse cx="45" cy="40" rx="16" ry="4" fill="#0f172a" opacity="0.2"/>
    <rect x="42" y="0" width="6" height="40" rx="3" fill="#64748b"/>
    <!-- Lamp Shade -->
    <polygon points="20,0 70,0 60,-32 30,-32" fill="#fef08a" stroke="#facc15" stroke-width="2"/>
  </g>

  <!-- Safety & Comfort Shield Badge -->
  <g transform="translate(410, 50)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="46" rx="23" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="26" cy="23" r="14" fill="#16a34a"/>
    <!-- Shield / Checkmark -->
    <path d="M 20 23 L 24 27 L 32 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">أمان وراحة بال</text>
  </g>
</svg>
