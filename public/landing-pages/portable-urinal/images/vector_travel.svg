<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="480" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="480" cy="90" r="42" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="480" cy="90" r="56" fill="#fde047" opacity="0.2"/>

  <!-- Distant Mountains/Hills -->
  <path d="M0 320 Q 120 230 260 280 T 520 250 Q 570 270 600 290 L 600 360 L 0 360 Z" fill="#cbd5e1" opacity="0.45"/>
  <path d="M0 330 Q 180 260 360 310 T 600 290 L 600 380 L 0 380 Z" fill="#94a3b8" opacity="0.35"/>

  <!-- Highway Road -->
  <polygon points="210,320 390,320 560,480 40,480" fill="url(#roadGrad)"/>

  <!-- Road Side Barriers / Curbs -->
  <polygon points="195,320 210,320 40,480 15,480" fill="#0d9488" opacity="0.8"/>
  <polygon points="390,320 405,320 585,480 560,480" fill="#0d9488" opacity="0.8"/>

  <!-- Center Road Dashes -->
  <polygon points="296,330 304,330 306,355 294,355" fill="#f8fafc" opacity="0.8"/>
  <polygon points="293,375 307,375 310,410 290,410" fill="#f8fafc" opacity="0.8"/>
  <polygon points="288,435 312,435 316,480 284,480" fill="#f8fafc" opacity="0.8"/>

  <!-- Sleek Modern Car (Perspective rear-quarter) -->
  <g transform="translate(235, 335)" filter="url(#shadow)">
    <!-- Car shadow -->
    <ellipse cx="65" cy="88" rx="80" ry="14" fill="rgba(15,23,42,0.3)"/>
    
    <!-- Wheels -->
    <rect x="0" y="65" width="22" height="26" rx="6" fill="#0f172a"/>
    <rect x="108" y="65" width="22" height="26" rx="6" fill="#0f172a"/>
    
    <!-- Lower Body -->
    <path d="M -5 50 Q -5 38 12 34 L 118 34 Q 135 38 135 50 L 135 74 Q 135 80 125 80 L 5 80 Q -5 80 -5 74 Z" fill="url(#carGrad)"/>
    
    <!-- Cabin & Windows -->
    <path d="M 12 34 L 28 12 Q 34 8 46 8 L 84 8 Q 96 8 102 12 L 118 34 Z" fill="#0f172a"/>
    <path d="M 18 32 L 32 14 Q 36 12 44 12 L 86 12 Q 94 12 98 14 L 112 32 Z" fill="#bae6fd" opacity="0.85"/>
    
    <!-- Tail lights (Red LED bar) -->
    <rect x="6" y="44" width="34" height="8" rx="3" fill="#ef4444"/>
    <rect x="90" y="44" width="34" height="8" rx="3" fill="#ef4444"/>
    <line x1="40" y1="48" x2="90" y2="48" stroke="#ef4444" stroke-width="2" opacity="0.7"/>

    <!-- License Plate Tag -->
    <rect x="52" y="58" width="26" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Highway Signpost on Right -->
  <g transform="translate(470, 230)" filter="url(#shadow)">
    <rect x="38" y="70" width="6" height="110" fill="#64748b"/>
    <rect x="0" y="0" width="82" height="74" rx="8" fill="#059669" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Sign Icons (Rest Area / Highway Symbol) -->
    <circle cx="41" cy="24" r="12" fill="#ffffff"/>
    <text x="41" y="29" font-family="sans-serif" font-size="14" font-weight="900" fill="#059669" text-anchor="middle">P</text>
    <rect x="18" y="44" width="46" height="6" rx="2" fill="#ffffff"/>
    <text x="41" y="62" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">طريق السفر</text>
  </g>

  <!-- Floating Pin / Location Badge -->
  <g transform="translate(70, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
    <circle cx="24" cy="21" r="12" fill="#0d9488"/>
    <circle cx="24" cy="21" r="5" fill="#ffffff"/>
    <text x="75" y="26" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">بدون توقف</text>
  </g>
</svg>
