name = "growix-platform"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"
pages_build_output_dir = ".vercel/output/static"

# ── Production bindings ─────────────────────────────────────────────────────
# KV (settings, products, landing pages, images), bound as STORE_KV (read by src/lib/db/kv.ts).
# Per merchant: create their own namespace (`wrangler kv namespace create STORE_KV`) and put its id here.
[[kv_namespaces]]
binding = "STORE_KV"
id = "c051d16cb4f44bc196304ef9f6709fb2"

# Orders / transactional data: D1, bound as DB (read by src/lib/db/d1.ts).
# Only used when the env var ORDERS_BACKEND=d1 is set; the default (kv) ignores this binding.
# Schema: migrations/*.sql  ->  `npx wrangler d1 migrations apply DB --remote`
[[d1_databases]]
binding = "DB"
database_name = "store-orders-prod"
database_id = "21658fdc-9d82-4dd3-9916-149382a17ffd"
migrations_dir = "migrations"

# Production (non-secret) variables. Secrets (ADMIN_PIN, AUTH_SECRET, ...) are set with
# `wrangler pages secret put <NAME> --project-name <project> --env production` and are never committed.
[vars]
ORDERS_BACKEND = "d1"
CATALOG_BACKEND = "d1"
BRAND_NAME = "RexRack"
DEMO_MODE = "1"

# ── Preview deployments (every non-main branch) ─────────────────────────────
# ISOLATED from the live store: its own empty KV namespace (store-preview), so testing a branch can never
# touch the production settings/products. Secrets (ADMIN_PIN, AUTH_SECRET) are set per environment with
# `wrangler pages secret put <NAME> --project-name <project> --env preview`.
[env.preview]

[[env.preview.kv_namespaces]]
binding = "STORE_KV"
id = "f3d58536bde340a69086390c2c461c56"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "store-orders"
database_id = "7c3cea96-28b7-4c79-8128-87e89ea3ed7a"

[env.preview.vars]
ORDERS_BACKEND = "d1"
CATALOG_BACKEND = "d1"
BRAND_NAME = "RexRack (preview)"
DEMO_MODE = "1"
